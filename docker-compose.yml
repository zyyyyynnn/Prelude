name: prelude

services:
  mysql:
    image: mysql:8.4
    container_name: prelude-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: prelude
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: prelude-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-alpine
    container_name: prelude-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  versitygw:
    image: versity/versitygw:v1.7.0
    container_name: prelude-versitygw
    restart: unless-stopped
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-prelude-local-key}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:-prelude-local-secret}
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /data/s3
      VGW_PORT: ":7070"
      VGW_HEALTH: /health
      VGW_IAM_DIR: /data/iam
      VGW_VERSIONING_DIR: /data/versioning
    ports:
      - "${S3_HOST_PORT:-19000}:7070"
    volumes:
      - versitygw-data:/data/s3
      - versitygw-iam:/data/iam
      - versitygw-versioning:/data/versioning
    healthcheck:
      # VersityGW v1.7.0 exposes a semantic health endpoint when VGW_HEALTH is
      # configured; busybox wget ships in the official image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 3s
      retries: 24

  backend:
    build:
      context: ./backend
    image: prelude/backend:latest
    container_name: prelude-backend
    restart: unless-stopped
    profiles: [app]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      versitygw:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/prelude?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      APP_CRYPTO_AES_SECRET: ${APP_CRYPTO_AES_SECRET:-prelude-local-development-secret-change-me}
      PRELUDE_S3_ENDPOINT: http://versitygw:7070
      PRELUDE_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:19000}
      PRELUDE_S3_BUCKET: ${S3_BUCKET:-prelude-assets}
      PRELUDE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-prelude-local-key}
      PRELUDE_S3_SECRET_KEY: ${S3_SECRET_KEY:-prelude-local-secret}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    image: prelude/frontend:latest
    container_name: prelude-frontend
    restart: unless-stopped
    profiles: [app]
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
  versitygw-data:
  versitygw-iam:
  versitygw-versioning:
