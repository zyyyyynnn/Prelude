  <text x="864" y="443" fill="#687778" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">结构化评估与训练趋势</text>

  <rect x="108" y="488" width="984" height="30" rx="10" fill="#DCCFC1"/>
  <text x="600" y="509" text-anchor="middle" fill="#67584E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">模型编排 · 工具调用 · 后台任务 · 活动记录 · 运行遥测</text>

