  <line x1="213" y1="582" x2="987" y2="582" stroke="#8A796D" stroke-width="2.5"/>
  <line x1="213" y1="582" x2="213" y2="610" stroke="#8A796D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="471" y1="582" x2="471" y2="610" stroke="#8A796D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="729" y1="582" x2="729" y2="610" stroke="#8A796D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="987" y1="582" x2="987" y2="610" stroke="#8A796D" stroke-width="2.5" marker-end="url(#arrow)"/>

