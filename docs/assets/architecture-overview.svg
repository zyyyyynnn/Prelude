  <text x="406" y="658" fill="#34464D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700">MySQL</text>
  <text x="406" y="686" fill="#60747B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">业务与会话持久化</text>

  <rect x="636" y="618" width="186" height="94" rx="18" fill="#E7DAD5" stroke="#B18478" stroke-width="2"/>
  <text x="664" y="658" fill="#553D37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700">Redis</text>
  <text x="664" y="686" fill="#765D56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">实时发布与订阅</text>

  <rect x="894" y="618" width="234" height="94" rx="18" fill="#E9DED0" stroke="#B49573" stroke-width="2"/>
  <text x="922" y="658" fill="#513F30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700">RabbitMQ</text>
  <text x="922" y="686" fill="#75624F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">异步报告任务</text>
