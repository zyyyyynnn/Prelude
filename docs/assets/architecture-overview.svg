  <rect x="72" y="278" width="1056" height="264" rx="24" fill="#EDE4D7" stroke="#B89E8D" stroke-width="2"/>
  <text x="108" y="322" fill="#3A302A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Spring Boot + Spring Modulith</text>
  <text x="108" y="349" fill="#79695F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">模块边界、业务用例与实时通信入口</text>

