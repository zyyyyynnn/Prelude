<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Prelude 高层系统架构总览</title>
  <desc id="description">用户通过 React 19 客户端访问 Spring Boot 与 Spring Modulith 应用，应用连接模型网关、MySQL、Redis 和 RabbitMQ。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A796D"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#F6F1E8"/>
  <rect x="1" y="1" width="1198" height="758" rx="27" fill="none" stroke="#D8CBBE" stroke-width="2"/>

  <text x="72" y="72" fill="#2F2925" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">Prelude 系统总览</text>
  <text x="72" y="106" fill="#756A62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">从面试体验到模型、数据与异步任务的高层职责边界</text>

  <rect x="72" y="146" width="180" height="64" rx="18" fill="#FBF8F2" stroke="#CFC2B7" stroke-width="2"/>
  <circle cx="108" cy="178" r="13" fill="#9A7A68"/>
  <path d="M89 198c3-12 10-18 19-18s16 6 19 18" fill="#9A7A68"/>
  <text x="140" y="185" fill="#3A322D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="650">使用者</text>

  <line x1="252" y1="178" x2="324" y2="178" stroke="#8A796D" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="330" y="134" width="798" height="88" rx="20" fill="#DDE7E7" stroke="#91A8A9" stroke-width="2"/>
  <text x="366" y="172" fill="#33464A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700">React 19 客户端</text>
  <text x="366" y="199" fill="#5E7377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">面试准备 · 文字与语音交互 · 历史会话 · 结构化报告 · 训练分析 · 全局设置</text>

