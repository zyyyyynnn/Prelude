name: Agent Lockfile Repair

on:
  push:
    branches:
      - agent/fix-focus-system-final
    paths:
      - .github/workflows/agent-lockfile-repair.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fix-focus-system-final

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate only the PostCSS lock entry
        shell: bash
        run: |
          set -euo pipefail
          cp frontend/package-lock.json "$RUNNER_TEMP/package-lock.before.json"
          npm --prefix frontend install --package-lock-only --ignore-scripts --no-audit --no-fund
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          before = json.loads(Path(os.environ['RUNNER_TEMP'], 'package-lock.before.json').read_text(encoding='utf-8'))
          after_path = Path('frontend/package-lock.json')
          after = json.loads(after_path.read_text(encoding='utf-8'))
          before_packages = before['packages']
          after_packages = after['packages']
          changed = sorted(
              key
              for key in set(before_packages) | set(after_packages)
              if before_packages.get(key) != after_packages.get(key)
          )
          expected = ['node_modules/postcss']
          if changed != expected:
              raise SystemExit(f'unexpected lockfile package changes: {changed}')
          postcss = after_packages['node_modules/postcss']
          expected_entry = {
              'version': '8.5.23',
              'resolved': 'https://registry.npmjs.org/postcss/-/postcss-8.5.23.tgz',
              'integrity': 'sha512-g50586zr4bZmwFiTlflMu8E0bDTb5I5gertgwAKmsdUlTQIhZtunzUlD1WSzwcVWPoAVpsrA6vlfCD7oXvRwgg==',
          }
          for key, value in expected_entry.items():
              if postcss.get(key) != value:
                  raise SystemExit(f'postcss {key} mismatch: {postcss.get(key)!r}')
          package = json.loads(Path('frontend/package.json').read_text(encoding='utf-8'))
          if package['overrides'].get('postcss') != '8.5.23':
              raise SystemExit('package.json PostCSS override is not 8.5.23')
          PY
          git diff --check

      - name: Commit lockfile and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/agent-lockfile-repair.yml
          git add frontend/package-lock.json
          git commit -m 'fix(deps): refresh postcss lock entry'
          git push origin HEAD:agent/fix-focus-system-final

      - name: Remove redundant failed runs from this repair cycle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          redundant_runs=(
            30923506482 30923504846 30923639228 30923638199
            30923744875 30923740270 30923905402 30923905773
            30923907489 30924169801 30924169981 30924173962
            30924945517 30924945942 30924942777 30924999025
            30925000441 30924999197 30927803998
          )
          for run_id in "${redundant_runs[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null 2>&1 || true
          done
