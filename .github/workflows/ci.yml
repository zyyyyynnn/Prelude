name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: prelude
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        working-directory: backend
        env:
          PRELUDE_MYSQL_SMOKE: 'true'
          PRELUDE_IDENTITY_SMOKE: 'true'
          PRELUDE_S3_SMOKE: 'true'
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/prelude?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root_password
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: '6379'
          SPRING_RABBITMQ_HOST: 127.0.0.1
          SPRING_RABBITMQ_PORT: '5672'
        run: mvn --batch-mode clean test

  frontend:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Verify frontend
        working-directory: frontend
        run: npm run check

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Verify production bundle
        working-directory: frontend
        run: npm run verify:production

      - name: Smoke tests
        working-directory: frontend
        run: npm run test:smoke

      - name: BYOK behavior
        working-directory: frontend
        run: npm run verify:byok

      - name: Dark theme
        working-directory: frontend
        run: npm run verify:dark

      - name: Accessibility
        working-directory: frontend
        run: npm run verify:a11y

      - name: Visual regression
        working-directory: frontend
        run: npm run verify:visual
