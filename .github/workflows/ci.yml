name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: prelude
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install architecture checker
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/sentrux/sentrux/releases/download/v0.5.7/sentrux-linux-x86_64'
          expected_sha256='3237f80fe20d54aad4deefa8a143f0d60543bb5d2d6ad891eb42432f155725a6'
          tool_directory="$RUNNER_TEMP/sentrux"
          executable="$tool_directory/sentrux"
          mkdir -p "$tool_directory"
          curl --fail --location --silent --show-error "$url" --output "$executable"
          echo "$expected_sha256  $executable" | sha256sum --check --status
          chmod +x "$executable"
          echo "$tool_directory" >> "$GITHUB_PATH"

      - name: Verify repository architecture
        run: sentrux check .

      - name: Check whitespace
        shell: bash
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        working-directory: backend
        env:
          PRELUDE_MYSQL_SMOKE: 'true'
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/prelude?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root_password
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: '6379'
          SPRING_RABBITMQ_HOST: 127.0.0.1
          SPRING_RABBITMQ_PORT: '5672'
        run: mvn --batch-mode clean test

      - name: Verify resolved dependency lines
        working-directory: backend
        shell: bash
        run: |
          mvn --batch-mode dependency:tree -DoutputFile=target/dependency-tree.txt
          ! grep -E 'mybatis-plus-spring-boot3-starter|spring-ai-[^:]+:[^:]+:[^:]+:2\.0\.0' target/dependency-tree.txt
          test "$(grep -oE 'org\.springframework\.ai:[^:]+:[^:]+:2\.0\.[0-9]+' target/dependency-tree.txt | sed -E 's/.*:(2\.0\.[0-9]+)$/\1/' | sort -u)" = '2.0.1'

  frontend:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Verify single React runtime
        working-directory: frontend
        shell: pwsh
        run: |
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $blocked = @('vue', 'vue-router', 'pinia', 'reka-ui', 'radix-vue', 'vue-tsc', 'html2canvas', 'jspdf')
          foreach ($name in $blocked) {
            if ($lock.packages.ContainsKey("node_modules/$name")) {
              throw "blocked package resolved: $name"
            }
          }
          if (Get-ChildItem src -Recurse -Filter *.vue) {
            throw 'Vue source found under frontend/src'
          }

      - name: Verify architecture and UI governance
        working-directory: frontend
        run: npm run check

      - name: Build and browser verification
        working-directory: frontend
        run: |
          npm run build
          npm run verify:production
          npm run test:smoke
          npm run verify:byok
          npm run verify:dark
          npm run verify:a11y
          npm run verify:visual
