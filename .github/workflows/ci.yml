name: CI

on:
  push:
    branches:
      - agent/fix-session-integrity-review

permissions:
  contents: write

jobs:
  format-review-test:
    runs-on: windows-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-session-integrity-review
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Apply repository formatter
        working-directory: frontend
        run: npm run check -- --fix

      - name: Commit only the account-race test formatting
        shell: pwsh
        run: |
          $allowed = 'frontend/tests/flows/interview-session.spec.ts'
          $changed = @(
            git status --short | ForEach-Object {
              $_.Substring(3).Trim().Replace('\', '/')
            }
          )
          $unexpected = @($changed | Where-Object { $_ -ne $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Formatter changed files outside the review whitelist: $($unexpected -join ', ')"
          }
          if ($changed.Count -eq 0) {
            Write-Output 'Account-race test already matches repository formatting'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $allowed
          git commit -m 'style(frontend): format account isolation flow'
          git push origin HEAD:agent/fix-session-integrity-review
