name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code_changed=false
          evidence_changed=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              README.md|docs/*|*.md) ;;
              *) code_changed=true ;;
            esac
            case "$file" in
              docs/screenshots/*) evidence_changed=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [ "$evidence_changed" = "true" ]; then
            code_changed=true
          fi
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  supply-chain:
    needs: detect
    if: needs.detect.outputs.code_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify vulnerability exception expiry
        run: node --test scripts/verify-vulnerability-exceptions.test.mjs && node scripts/verify-vulnerability-exceptions.mjs

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Generate runtime SBOMs
        run: |
          mvn --batch-mode -f backend/pom.xml -Pquality cyclonedx:makeBom > /tmp/backend-sbom.log 2>&1 &
          backend_pid=$!
          npm --prefix frontend run generate:sbom > /tmp/frontend-sbom.log 2>&1 &
          frontend_pid=$!
          status=0
          wait "$backend_pid" || status=1
          wait "$frontend_pid" || status=1
          cat /tmp/backend-sbom.log /tmp/frontend-sbom.log
          exit "$status"

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build runtime images
        uses: docker/bake-action@v7.5.0
        with:
          files: ./docker-bake.hcl
          load: true
          push: false

      - name: Generate container SBOMs
        run: |
          node --test scripts/normalize-sbom.test.mjs
          docker save prelude-backend:ci -o /tmp/prelude-backend-image.tar
          docker save prelude-frontend:ci -o /tmp/prelude-frontend-image.tar
          scan_image() {
            docker run --rm -v /tmp:/tmp anchore/syft:v1.57.2 scan "docker-archive:/tmp/$1" -q -o cyclonedx-json
          }
          scan_image prelude-backend-image.tar > backend/target/image-bom.json &
          backend_first=$!
          scan_image prelude-backend-image.tar > /tmp/backend-image-bom-second.json &
          backend_second=$!
          scan_image prelude-frontend-image.tar > frontend/output/image-sbom.cdx.json &
          frontend_first=$!
          scan_image prelude-frontend-image.tar > /tmp/frontend-image-bom-second.json &
          frontend_second=$!
          status=0
          for pid in "$backend_first" "$backend_second" "$frontend_first" "$frontend_second"; do
            wait "$pid" || status=1
          done
          [ "$status" -eq 0 ] || exit "$status"
          node scripts/normalize-sbom.mjs backend/target/image-bom.json
          node scripts/normalize-sbom.mjs /tmp/backend-image-bom-second.json
          cmp backend/target/image-bom.json /tmp/backend-image-bom-second.json
          node scripts/normalize-sbom.mjs frontend/output/image-sbom.cdx.json
          node scripts/normalize-sbom.mjs /tmp/frontend-image-bom-second.json
          cmp frontend/output/image-sbom.cdx.json /tmp/frontend-image-bom-second.json

      - name: Verify dependency license notices
        run: |
          npm --prefix frontend run licenses:notices
          git diff --exit-code -- backend/src/main/resources/licenses/NOTICE.txt frontend/public/licenses/NOTICE.txt

      - name: Verify dependency licenses
        working-directory: frontend
        run: npm run verify:licenses

      - name: Verify container licenses
        run: |
          node --test frontend/scripts/verify-container-licenses.test.cjs
          node frontend/scripts/verify-container-licenses.cjs backend/target/bom.json frontend/output/sbom.cdx.json backend/target/image-bom.json frontend/output/image-sbom.cdx.json

      - name: Verify container license notices
        run: |
          docker create --name prelude-backend-notice prelude-backend:ci
          docker cp prelude-backend-notice:/app/licenses/NOTICE.txt /tmp/prelude-backend-NOTICE.txt
          docker cp prelude-backend-notice:/app/licenses/LICENSE /tmp/prelude-backend-LICENSE
          docker rm prelude-backend-notice
          cmp backend/src/main/resources/licenses/NOTICE.txt /tmp/prelude-backend-NOTICE.txt
          cmp LICENSE /tmp/prelude-backend-LICENSE
          docker create --name prelude-frontend-notice prelude-frontend:ci
          docker cp prelude-frontend-notice:/srv/licenses/NOTICE.txt /tmp/prelude-frontend-NOTICE.txt
          docker cp prelude-frontend-notice:/srv/licenses/LICENSE /tmp/prelude-frontend-LICENSE
          docker cp prelude-frontend-notice:/srv/licenses/paper-design-shaders.txt /tmp/prelude-paper-design-shaders.txt
          docker rm prelude-frontend-notice
          cmp frontend/public/licenses/NOTICE.txt /tmp/prelude-frontend-NOTICE.txt
          cmp LICENSE /tmp/prelude-frontend-LICENSE
          cmp frontend/public/licenses/paper-design-shaders.txt /tmp/prelude-paper-design-shaders.txt

      - name: Install pinned Grype
        run: |
          version=0.122.1
          archive="grype_${version}_linux_amd64.tar.gz"
          release_url="https://github.com/anchore/grype/releases/download/v${version}"
          curl -fsSL "$release_url/$archive" -o "/tmp/$archive"
          curl -fsSL "$release_url/grype_${version}_checksums.txt" -o /tmp/grype-checksums.txt
          expected=$(grep -F " $archive" /tmp/grype-checksums.txt | cut -d' ' -f1)
          test -n "$expected"
          echo "$expected  /tmp/$archive" | sha256sum --check --status
          tar -xzf "/tmp/$archive" -C /tmp grype
          echo "/tmp" >> "$GITHUB_PATH"

      - name: Scan runtime and container vulnerabilities
        env:
          GRYPE_DB_AUTO_UPDATE: 'false'
        run: |
          grype db update
          scan() {
            grype "sbom:$1" --fail-on high --output json > "$2"
          }
          scan backend/target/bom.json backend-vulnerabilities.json &
          backend_runtime=$!
          scan frontend/output/sbom.cdx.json frontend-vulnerabilities.json &
          frontend_runtime=$!
          scan backend/target/image-bom.json backend-image-vulnerabilities.json &
          backend_image=$!
          scan frontend/output/image-sbom.cdx.json frontend-image-vulnerabilities.json &
          frontend_image=$!
          status=0
          for pid in "$backend_runtime" "$frontend_runtime" "$backend_image" "$frontend_image"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Package scanned runtime images
        run: docker save prelude-backend:ci prelude-frontend:ci | gzip > runtime-images.tar.gz

      - name: Upload scanned runtime images
        uses: actions/upload-artifact@v7.0.2
        with:
          name: runtime-images
          path: runtime-images.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload dependency scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: runtime-dependency-sboms
          path: |
            backend/target/bom.json
            backend/target/image-bom.json
            frontend/output/sbom.cdx.json
            frontend/output/image-sbom.cdx.json
            frontend/output/license-report.json
            backend/src/main/resources/licenses/NOTICE.txt
            frontend/public/licenses/NOTICE.txt
            backend-vulnerabilities.json
            frontend-vulnerabilities.json
            backend-image-vulnerabilities.json
            frontend-image-vulnerabilities.json
          if-no-files-found: error
          retention-days: 7

  backend-tests:
    needs: detect
    if: needs.detect.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: prelude
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Prepare empty Flyway database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot_password -e "DROP DATABASE IF EXISTS prelude_flyway; CREATE DATABASE prelude_flyway CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Verify backend
        working-directory: backend
        env:
          PRELUDE_MYSQL_SMOKE: 'true'
          PRELUDE_IDENTITY_SMOKE: 'true'
          PRELUDE_S3_SMOKE: 'true'
          PRELUDE_FLYWAY_SMOKE: 'true'
          PRELUDE_FLYWAY_SMOKE_URL: jdbc:mysql://127.0.0.1:3306/prelude_flyway?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
          PRELUDE_FLYWAY_SMOKE_USERNAME: root
          PRELUDE_FLYWAY_SMOKE_PASSWORD: root_password
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/prelude?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root_password
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: '6379'
          SPRING_RABBITMQ_HOST: 127.0.0.1
          SPRING_RABBITMQ_PORT: '5672'
        run: mvn --batch-mode clean test

  backend:
    needs: [detect, backend-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require backend tests
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          CODE_CHANGED: ${{ needs.detect.outputs.code_changed }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "change detection failed"
            exit 1
          fi
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "Docs-only change; backend tests skipped"
            exit 0
          fi
          if [ "$BACKEND_RESULT" != "success" ]; then
            echo "backend tests did not succeed: $BACKEND_RESULT"
            exit 1
          fi

  frontend-checks:
    needs: detect
    if: needs.detect.outputs.code_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Cache Vite task cache
        uses: actions/cache@v6.1.0
        with:
          path: frontend/node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-${{ hashFiles('frontend/package-lock.json', 'frontend/vite.config.ts') }}

      - name: Verify frontend
        working-directory: frontend
        run: npm run check

      - name: Verify frontend architecture and UI contracts
        working-directory: frontend
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm run verify:architecture
          npm run verify:oxc
          npm run verify:governance
          npm run verify:flaky
          npm run verify:ui
          npm run verify:tokens

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Verify cascade collisions
        working-directory: frontend
        run: npm run verify:cascade

      - name: Verify production bundle
        working-directory: frontend
        run: npm run verify:production

      - name: Verify committed visual evidence
        working-directory: frontend
        run: npm run verify:evidence

      - name: Verify demo copy
        working-directory: frontend
        run: npm run verify:demo-copy

  frontend-browser:
    needs: detect
    if: needs.detect.outputs.code_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, features, identity, visual]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install the pinned browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run browser suite
        shell: bash
        run: |
          case "${{ matrix.suite }}" in
            smoke)
              npm --prefix frontend run test:smoke
              ;;
            features)
              npm --prefix frontend run test:browser-features
              ;;
            identity)
              npm --prefix frontend run verify:identity
              ;;
            visual)
              npm --prefix frontend run verify:visual
              npm --prefix frontend run capture:surfaces
              git diff --exit-code -- docs/screenshots
              npm --prefix frontend run visual:diff-report
              ;;
          esac

      - name: Upload visual evidence
        if: ${{ !cancelled() && matrix.suite == 'visual' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-regression-evidence
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/*.md
            frontend/output/visual-diffs/**
            docs/screenshots/manifest.json
          retention-days: 7
          if-no-files-found: warn

  frontend:
    needs: [detect, frontend-checks, frontend-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require frontend checks
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          CODE_CHANGED: ${{ needs.detect.outputs.code_changed }}
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
          BROWSER_RESULT: ${{ needs.frontend-browser.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "change detection failed"
            exit 1
          fi
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "Docs-only change; frontend checks skipped"
            exit 0
          fi
          if [ "$CHECKS_RESULT" != "success" ] || [ "$BROWSER_RESULT" != "success" ]; then
            echo "frontend checks did not succeed: checks=$CHECKS_RESULT browser=$BROWSER_RESULT"
            exit 1
          fi

  release-smoke:
    needs: [detect, supply-chain]
    if: ${{ always() && needs.detect.result == 'success' && needs.detect.outputs.code_changed == 'true' && needs.supply-chain.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      APP_CRYPTO_AES_SECRET: prelude-release-smoke-only-secret
      COMPOSE_PROFILES: app
      COMPOSE_PROJECT_NAME: prelude-release-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install the pinned browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Download scanned runtime images
        uses: actions/download-artifact@v8.0.2
        with:
          name: runtime-images

      - name: Load scanned runtime images
        run: |
          docker load -i runtime-images.tar.gz
          docker tag prelude-backend:ci prelude/backend:release
          docker tag prelude-frontend:ci prelude/frontend:release

      - name: Start isolated release services
        run: docker compose -f docker-compose.yml -f docker-compose.release-smoke.yml up -d --wait --wait-timeout 180

      - name: Wait for release frontend
        run: curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:14173/api/auth/oauth/providers

      - name: Run full-stack release smoke
        working-directory: frontend
        env:
          RELEASE_BASE_URL: http://127.0.0.1:14173
        run: npx playwright test --config=playwright.release.config.ts

      - name: Collect release diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p release-smoke
          docker compose -f docker-compose.yml -f docker-compose.release-smoke.yml ps > release-smoke/services.txt
          docker compose -f docker-compose.yml -f docker-compose.release-smoke.yml logs --no-color > release-smoke/services.log
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg backend "$(docker image inspect prelude/backend:release --format '{{.Id}}')" \
            --arg frontend "$(docker image inspect prelude/frontend:release --format '{{.Id}}')" \
            '{sha:$sha,run:$run,backendImage:$backend,frontendImage:$frontend}' > release-smoke/summary.json

      - name: Stop isolated release services
        if: ${{ always() }}
        run: docker compose -f docker-compose.yml -f docker-compose.release-smoke.yml down -v --remove-orphans

      - name: Upload release smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-smoke-evidence
          path: |
            release-smoke/**
            frontend/output/release-smoke/**
            frontend/test-results/**
          if-no-files-found: error
          retention-days: 14
