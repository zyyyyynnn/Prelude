name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate deterministic frontend lockfile
        shell: pwsh
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path (Get-Location) 'package-lock.json'))
          $memory = New-Object System.IO.MemoryStream
          $gzip = New-Object System.IO.Compression.GZipStream(
            $memory,
            [System.IO.Compression.CompressionMode]::Compress,
            $true
          )
          $gzip.Write($bytes, 0, $bytes.Length)
          $gzip.Dispose()
          $encoded = [Convert]::ToBase64String($memory.ToArray())
          $memory.Dispose()
          Write-Output "LOCKFILE_GZIP_BASE64_BEGIN"
          Write-Output $encoded
          Write-Output "LOCKFILE_GZIP_BASE64_END"
