name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          working-directory: frontend
          run-install: 'false'
          cache: 'true'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify vulnerability exception expiry
        run: node --test scripts/verify-vulnerability-exceptions.test.mjs && node scripts/verify-vulnerability-exceptions.mjs

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate backend runtime SBOM
        run: mvn --batch-mode -f backend/pom.xml -Pquality cyclonedx:makeBom

      - name: Generate frontend runtime SBOM
        working-directory: frontend
        run: npm run generate:sbom

      - name: Build runtime images
        run: |
          docker build -t prelude-backend:ci ./backend
          docker build -t prelude-frontend:ci ./frontend

      - name: Generate container SBOMs
        run: |
          docker save prelude-backend:ci -o /tmp/prelude-backend-image.tar
          docker save prelude-frontend:ci -o /tmp/prelude-frontend-image.tar
          docker run --rm -v /tmp:/tmp anchore/syft:v1.57.2 scan docker-archive:/tmp/prelude-backend-image.tar -q -o cyclonedx-json > backend/target/image-bom.json
          docker run --rm -v /tmp:/tmp anchore/syft:v1.57.2 scan docker-archive:/tmp/prelude-frontend-image.tar -q -o cyclonedx-json > frontend/output/image-sbom.cdx.json

      - name: Verify dependency license notices
        run: |
          npm --prefix frontend run licenses:notices
          git diff --exit-code -- backend/src/main/resources/licenses/NOTICE.txt frontend/public/licenses/NOTICE.txt

      - name: Verify dependency licenses
        working-directory: frontend
        run: npm run verify:licenses

      - name: Scan backend runtime vulnerabilities
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          sbom: backend/target/bom.json
          grype-version: v0.122.1
          fail-build: true
          only-fixed: false
          severity-cutoff: high
          output-format: json
          output-file: backend-vulnerabilities.json

      - name: Scan frontend runtime vulnerabilities
        if: ${{ !cancelled() }}
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          sbom: frontend/output/sbom.cdx.json
          grype-version: v0.122.1
          fail-build: true
          only-fixed: false
          severity-cutoff: high
          output-format: json
          output-file: frontend-vulnerabilities.json

      - name: Scan backend container vulnerabilities
        if: ${{ !cancelled() }}
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          sbom: backend/target/image-bom.json
          grype-version: v0.122.1
          fail-build: true
          only-fixed: false
          severity-cutoff: high
          output-format: json
          output-file: backend-image-vulnerabilities.json

      - name: Scan frontend container vulnerabilities
        if: ${{ !cancelled() }}
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          sbom: frontend/output/image-sbom.cdx.json
          grype-version: v0.122.1
          fail-build: true
          only-fixed: false
          severity-cutoff: high
          output-format: json
          output-file: frontend-image-vulnerabilities.json

      - name: Upload dependency scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: runtime-dependency-sboms
          path: |
            backend/target/bom.json
            backend/target/image-bom.json
            frontend/output/sbom.cdx.json
            frontend/output/image-sbom.cdx.json
            frontend/output/license-report.json
            backend/src/main/resources/licenses/NOTICE.txt
            frontend/public/licenses/NOTICE.txt
            backend-vulnerabilities.json
            frontend-vulnerabilities.json
            backend-image-vulnerabilities.json
            frontend-image-vulnerabilities.json
          if-no-files-found: error
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: prelude
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prepare empty Flyway database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot_password -e "DROP DATABASE IF EXISTS prelude_flyway; CREATE DATABASE prelude_flyway CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Verify backend
        working-directory: backend
        env:
          PRELUDE_MYSQL_SMOKE: 'true'
          PRELUDE_IDENTITY_SMOKE: 'true'
          PRELUDE_S3_SMOKE: 'true'
          PRELUDE_FLYWAY_SMOKE: 'true'
          PRELUDE_FLYWAY_SMOKE_URL: jdbc:mysql://127.0.0.1:3306/prelude_flyway?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
          PRELUDE_FLYWAY_SMOKE_USERNAME: root
          PRELUDE_FLYWAY_SMOKE_PASSWORD: root_password
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/prelude?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root_password
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: '6379'
          SPRING_RABBITMQ_HOST: 127.0.0.1
          SPRING_RABBITMQ_PORT: '5672'
        run: mvn --batch-mode clean test

  frontend:
    needs: supply-chain
    if: ${{ always() }}
    runs-on: windows-latest

    steps:
      - name: Require supply chain success
        shell: bash
        env:
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
        run: |
          if [ "$SUPPLY_CHAIN_RESULT" != "success" ]; then
            echo "supply-chain did not succeed: $SUPPLY_CHAIN_RESULT"
            exit 1
          fi

      # Governance compares the full commit range against main.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          working-directory: frontend
          run-install: 'false'
          cache: 'true'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Vite task cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-cache-${{ hashFiles('frontend/package-lock.json', 'frontend/vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-cache-${{ hashFiles('frontend/package-lock.json', 'frontend/vite.config.ts') }}-
            ${{ runner.os }}-vite-task-cache-

      - name: Verify frontend
        working-directory: frontend
        run: npm run check

      - name: Verify frontend architecture and UI contracts
        working-directory: frontend
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm run verify:architecture
          npm run verify:oxc
          npm run verify:governance
          npm run verify:flaky
          npm run verify:ui
          npm run verify:tokens

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      # Use the browser version pinned by @playwright/test.
      - name: Install the pinned browser
        working-directory: frontend
        run: npx playwright install chromium

      - name: Smoke tests
        working-directory: frontend
        run: npm run test:smoke

      - name: Identity and account isolation
        working-directory: frontend
        run: npm run verify:identity

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      # Needs the built stylesheet: cascade order only exists in the emitted CSS.
      - name: Verify cascade collisions
        working-directory: frontend
        run: npm run verify:cascade

      - name: Verify production bundle
        working-directory: frontend
        run: npm run verify:production

      - name: BYOK behavior
        working-directory: frontend
        run: npm run verify:byok

      - name: Dark theme
        working-directory: frontend
        run: npm run verify:dark

      - name: Accessibility
        working-directory: frontend
        run: npm run verify:a11y

      - name: Visual regression
        working-directory: frontend
        run: npm run verify:visual

      - name: Verify committed visual evidence
        working-directory: frontend
        run: npm run verify:evidence

      - name: Capture surface references
        working-directory: frontend
        run: npm run capture:surfaces

      - name: Verify surface capture reproducibility
        run: git diff --exit-code -- docs/screenshots

      - name: Verify demo copy
        working-directory: frontend
        run: npm run verify:demo-copy

      - name: Collect visual evidence
        working-directory: frontend
        run: npm run visual:diff-report

      # Preserve actual and diff frames so pixel failures remain diagnosable.
      - name: Upload visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: visual-regression-evidence
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/*.md
            frontend/output/visual-diffs/**
            docs/screenshots/manifest.json
          retention-days: 7
          if-no-files-found: warn

  release-smoke:
    needs: [supply-chain, backend]
    runs-on: ubuntu-latest
    env:
      APP_CRYPTO_AES_SECRET: prelude-release-smoke-only-secret
      COMPOSE_PROFILES: app
      COMPOSE_PROJECT_NAME: prelude-release-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          working-directory: frontend
          run-install: 'false'
          cache: 'true'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the pinned browser
        working-directory: frontend
        run: npx playwright install chromium

      - name: Build release images
        run: |
          docker build -t prelude/backend:release ./backend
          docker build -t prelude/frontend:release ./frontend

      - name: Start isolated release services
        run: docker compose -f docker-compose.yml -f docker-compose.release-smoke.yml up -d --wait --wait-timeout 180

      - name: Wait for release frontend
        run: curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:14173/api/auth/oauth/providers

      - name: Run full-stack release smoke
        working-directory: frontend
        env:
          RELEASE_BASE_URL: http://127.0.0.1:14173
        run: npx playwright test --config=playwright.release.config.ts

      - name: Collect release diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p release-smoke
          docker compose -f docker-compose.yml -f docker-compose.release-smoke.yml ps > release-smoke/services.txt
          docker compose -f docker-compose.yml -f docker-compose.release-smoke.yml logs --no-color > release-smoke/services.log
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg backend "$(docker image inspect prelude/backend:release --format '{{.Id}}')" \
            --arg frontend "$(docker image inspect prelude/frontend:release --format '{{.Id}}')" \
            '{sha:$sha,run:$run,backendImage:$backend,frontendImage:$frontend}' > release-smoke/summary.json

      - name: Stop isolated release services
        if: ${{ always() }}
        run: docker compose -f docker-compose.yml -f docker-compose.release-smoke.yml down -v --remove-orphans

      - name: Upload release smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-smoke-evidence
          path: |
            release-smoke/**
            frontend/output/release-smoke/**
            frontend/test-results/**
          if-no-files-found: error
          retention-days: 14
