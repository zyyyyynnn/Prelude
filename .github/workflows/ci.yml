name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          working-directory: frontend
          run-install: 'false'
          cache: 'true'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate backend runtime SBOM
        run: mvn --batch-mode -f backend/pom.xml -Pquality cyclonedx:makeBom

      - name: Generate frontend runtime SBOM
        working-directory: frontend
        run: npm run generate:sbom

      - name: Verify dependency licenses
        working-directory: frontend
        run: npm run verify:licenses

      - name: Scan backend runtime vulnerabilities
        uses: anchore/scan-action@82049099348cd4edcc94d22cafd8f1e9f8493321 # v7.4.3
        with:
          sbom: backend/target/bom.json
          grype-version: v0.122.1
          fail-build: true
          only-fixed: false
          severity-cutoff: high
          output-format: json
          output-file: backend-vulnerabilities.json

      - name: Scan frontend runtime vulnerabilities
        if: ${{ !cancelled() }}
        uses: anchore/scan-action@82049099348cd4edcc94d22cafd8f1e9f8493321 # v7.4.3
        with:
          sbom: frontend/output/sbom.cdx.json
          grype-version: v0.122.1
          fail-build: true
          only-fixed: false
          severity-cutoff: high
          output-format: json
          output-file: frontend-vulnerabilities.json

      - name: Upload dependency scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: runtime-dependency-sboms
          path: |
            backend/target/bom.json
            frontend/output/sbom.cdx.json
            backend-vulnerabilities.json
            frontend-vulnerabilities.json
          if-no-files-found: error
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: prelude
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        working-directory: backend
        env:
          PRELUDE_MYSQL_SMOKE: 'true'
          PRELUDE_IDENTITY_SMOKE: 'true'
          PRELUDE_S3_SMOKE: 'true'
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/prelude?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root_password
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: '6379'
          SPRING_RABBITMQ_HOST: 127.0.0.1
          SPRING_RABBITMQ_PORT: '5672'
        run: mvn --batch-mode clean test

  frontend:
    needs: supply-chain
    if: ${{ always() }}
    runs-on: windows-latest

    steps:
      - name: Require supply chain success
        shell: bash
        env:
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
        run: |
          if [ "$SUPPLY_CHAIN_RESULT" != "success" ]; then
            echo "supply-chain did not succeed: $SUPPLY_CHAIN_RESULT"
            exit 1
          fi

      # Governance compares the full commit range against main.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          working-directory: frontend
          run-install: 'false'
          cache: 'true'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Vite task cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-cache-${{ hashFiles('frontend/package-lock.json', 'frontend/vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-cache-${{ hashFiles('frontend/package-lock.json', 'frontend/vite.config.ts') }}-
            ${{ runner.os }}-vite-task-cache-

      - name: Verify frontend
        working-directory: frontend
        run: npm run check

      - name: Verify frontend architecture and UI contracts
        working-directory: frontend
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm run verify:architecture
          npm run verify:oxc
          npm run verify:governance
          npm run verify:ui
          npm run verify:tokens

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      # Use the browser version pinned by @playwright/test.
      - name: Install the pinned browser
        working-directory: frontend
        run: npx playwright install chromium

      - name: Smoke tests
        working-directory: frontend
        run: npm run test:smoke

      - name: Identity and account isolation
        working-directory: frontend
        run: npm run verify:identity

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      # Needs the built stylesheet: cascade order only exists in the emitted CSS.
      - name: Verify cascade collisions
        working-directory: frontend
        run: npm run verify:cascade

      - name: Verify production bundle
        working-directory: frontend
        run: npm run verify:production

      - name: BYOK behavior
        working-directory: frontend
        run: npm run verify:byok

      - name: Dark theme
        working-directory: frontend
        run: npm run verify:dark

      - name: Accessibility
        working-directory: frontend
        run: npm run verify:a11y

      - name: Visual regression
        working-directory: frontend
        run: npm run verify:visual

      - name: Verify committed visual evidence
        working-directory: frontend
        run: npm run verify:evidence

      - name: Capture surface references
        working-directory: frontend
        run: npm run capture:surfaces

      - name: Verify surface capture reproducibility
        run: git diff --exit-code -- docs/screenshots

      - name: Verify demo copy
        working-directory: frontend
        run: npm run verify:demo-copy

      - name: Collect visual evidence
        working-directory: frontend
        run: npm run visual:diff-report

      # Preserve actual and diff frames so pixel failures remain diagnosable.
      - name: Upload visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: visual-regression-evidence
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/*.md
            frontend/output/visual-diffs/**
            docs/screenshots/manifest.json
          retention-days: 7
          if-no-files-found: error
