name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: prelude
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        working-directory: backend
        env:
          PRELUDE_MYSQL_SMOKE: 'true'
          PRELUDE_IDENTITY_SMOKE: 'true'
          PRELUDE_S3_SMOKE: 'true'
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/prelude?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root_password
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: '6379'
          SPRING_RABBITMQ_HOST: 127.0.0.1
          SPRING_RABBITMQ_PORT: '5672'
        run: mvn --batch-mode clean test

  frontend:
    runs-on: windows-latest

    steps:
      # The governance gate compares commit subjects against main, so this job needs the same
      # full history the backend job gets: a shallow checkout leaves it checking one commit and
      # calling that a pass.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          version: '1.0.0'
          node-version: '24'
          working-directory: frontend
          run-install: 'false'
          cache: 'true'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Vite task cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-cache-${{ hashFiles('frontend/package-lock.json', 'frontend/vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-cache-${{ hashFiles('frontend/package-lock.json', 'frontend/vite.config.ts') }}-
            ${{ runner.os }}-vite-task-cache-

      # The version comes from the @playwright/test pin, so the runner and a workstation
      # rasterise the same way instead of agreeing by luck.
      - name: Install the pinned browser
        working-directory: frontend
        run: npx playwright install chromium

      - name: Audit runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Verify frontend
        working-directory: frontend
        run: npm run check

      - name: Verify frontend architecture and UI contracts
        working-directory: frontend
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm run verify:architecture
          npm run verify:governance
          npm run verify:ui
          npm run verify:tokens

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      # Needs the built stylesheet: cascade order only exists in the emitted CSS.
      - name: Verify cascade collisions
        working-directory: frontend
        run: npm run verify:cascade

      - name: Verify production bundle
        working-directory: frontend
        run: npm run verify:production

      - name: Smoke tests
        working-directory: frontend
        run: npm run test:smoke

      - name: BYOK behavior
        working-directory: frontend
        run: npm run verify:byok

      - name: Dark theme
        working-directory: frontend
        run: npm run verify:dark

      - name: Accessibility
        working-directory: frontend
        run: npm run verify:a11y

      - name: Visual regression
        working-directory: frontend
        run: npm run verify:visual

      # The resume workspace's contract — the decision surface, the queue states, and which
      # controls the composer is allowed to show. Its own lane because it pins a contract rather
      # than a journey, and it has to fail loudly when the two drift apart.
      - name: Verify UI contracts
        working-directory: frontend
        run: npm run verify:contract

      - name: Verify demo copy
        working-directory: frontend
        run: npm run verify:demo-copy

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      # A pixel gate that fails without leaving the frames behind cannot be diagnosed: the
      # only evidence is "N pixels differ", which does not say *which* N. Upload the raw
      # actual/diff PNGs Playwright writes under test-results so a runner-vs-workstation
      # difference can be read as an image instead of guessed at.
      - name: Upload visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: visual-regression-evidence
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/*.md
          retention-days: 7
          if-no-files-found: ignore
