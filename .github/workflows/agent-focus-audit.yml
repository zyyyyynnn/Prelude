name: Agent Focus Audit

on:
  push:
    branches:
      - agent/fix-focus-system-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit focus implementation and tracked noise
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          {
            echo '=== HEAD ==='
            git log -1 --oneline
            echo
            echo '=== FOCUS CLASS TOKENS ==='
            rg -n --glob '*.vue' --glob '*.ts' --glob '*.css' --glob '*.cjs' \
              'focus-visible:ring-|focus:ring-|ring-offset-|shadow-icon-action-focus|:focus-visible|:focus-within' \
              frontend/src frontend/scripts DESIGN.md docs || true
            echo
            echo '=== FOCUS/OUTLINE DECLARATIONS ==='
            rg -n --glob '*.vue' --glob '*.ts' --glob '*.css' \
              'outline:\s*none|outline-none|focus-visible:outline-none|focus:outline-none|box-shadow:' \
              frontend/src || true
            echo
            echo '=== INTERACTIVE ELEMENTS ==='
            rg -n --glob '*.vue' '<button|<input|<textarea|<select|role="button"|role="combobox"|tabindex=' frontend/src || true
            echo
            echo '=== SUSPICIOUS TRACKED FILES ==='
            git ls-files | grep -Ei '(^|/)(output|tmp|temp|logs?|backups?|artifacts?)(/|$)|\.(tmp|bak|orig|rej|patch|diff|log)$|(^|/)(final-report|audit-report|review-report|cleanup-report)[^/]*\.(md|txt)$' || true
            echo
            echo '=== FOCUS-RELATED BRANCHES ==='
            git branch -r | grep -E 'focus|agent/fix-focus' || true
          } | tee audit/focus-audit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: agent-focus-audit
          path: audit/focus-audit.txt
          retention-days: 3
