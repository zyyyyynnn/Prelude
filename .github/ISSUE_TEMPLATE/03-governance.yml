# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: Governance / CI / Docs
description: Engineering governance, CI gates, documentation standards, releases, and repository-wide constraints
body:
  - type: markdown
    attributes:
      value: |
        Use `<type>(<scope>): <semantic title>` for the title.
        Maintain durable governance rules only. Do not track project progress, phase status, or verification logs.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the governance outcome that must be established or consolidated.
    validations:
      required: true

  - type: textarea
    id: specification
    attributes:
      label: Specification
      description: Record repository, toolchain, quality-gate, or documentation rules that must not be violated.
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design
      description: Complete only when the governance proposal has structural, ownership, or workflow design.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Use a checklist to express governance outcomes. Do not include CI runs or test counts.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
