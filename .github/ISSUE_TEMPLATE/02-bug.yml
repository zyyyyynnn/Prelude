# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: Bug / Regression
description: Reproducible errors, regressions, or behavior that violates an established contract
body:
  - type: markdown
    attributes:
      value: |
        Use `fix(<scope>): <problem statement>` for the title and describe the problem rather than the solution.
        Describe one reproducible problem per issue.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the current incorrect behavior, its impact, and the conditions under which it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal, stable, and repeatable reproduction steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the correct behavior required by the established contract.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include only relevant versions, platforms, browsers, providers, or runtime conditions.
      placeholder: |
        - Branch / Commit:
        - Runtime / Browser:
        - Other relevant conditions:
    validations:
      required: false

  - type: textarea
    id: supplement
    attributes:
      label: Supplement
      description: Logs, screenshots, a minimal reproduction repository, or other required context.
    validations:
      required: false
