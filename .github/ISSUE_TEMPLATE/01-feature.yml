# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: Feature / Architecture
description: New capabilities, domain design, architecture boundaries, or long-term behavior contracts
body:
  - type: markdown
    attributes:
      value: |
        Use `<type>(<scope>): <semantic title>` for the title, for example `feat(llm): govern model execution and BYOK`.
        Describe durable goals, specifications, design, and acceptance outcomes only. Do not record implementation phases, review history, or test logs.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the problem, its value, and the final state that must be reached.
      placeholder: Establish ... so that ... can eventually ...
    validations:
      required: true

  - type: textarea
    id: specification
    attributes:
      label: Specification
      description: Record only stable product, technical, and governance rules that the implementation must not violate. Leave empty when no additional specification is needed.
      placeholder: |
        - ... is the only ...
        - ... must ...
        - ... must not ...
    validations:
      required: false

  - type: textarea
    id: design
    attributes:
      label: Design
      description: Describe required domain models, module boundaries, state flows, data ownership, or observable behavior. Leave empty for simple issues.
      placeholder: Use `###` headings to organize complex content.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: State only the outcomes that must hold. Do not prescribe test classes, test counts, or CI runs.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: supplement
    attributes:
      label: Supplement
      description: Add only durable information that does not fit the sections above. Leave empty when none is needed.
    validations:
      required: false
