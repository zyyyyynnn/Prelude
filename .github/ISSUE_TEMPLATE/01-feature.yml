name: Feature / Architecture
description: 新能力、领域设计、架构边界或长期行为契约
title: ""
body:
  - type: markdown
    attributes:
      value: |
        标题使用 `<type>(<scope>): <semantic title>`，例如 `feat(llm): govern model execution and BYOK`。
        正文只描述长期有效的目标、规范、设计与验收结果，不记录实施阶段、Review 过程或测试流水账。

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 描述需要解决的问题、价值以及最终应达到的状态。
      placeholder: 建立……，使……最终能够……
    validations:
      required: true

  - type: textarea
    id: specification
    attributes:
      label: 规范
      description: 仅记录实现不得偏离的稳定产品、技术与治理规则；没有必要规范时可留空。
      placeholder: |
        - ……是唯一……
        - ……必须……
        - ……不得……
    validations:
      required: false

  - type: textarea
    id: design
    attributes:
      label: 设计
      description: 描述必要的领域模型、模块边界、状态流、数据所有权或可观察行为；简单 Issue 可留空。
      placeholder: 可使用 `###` 三级标题组织复杂内容。
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 验收
      description: 只写最终必须成立的结果，不指定测试类、测试数量或 CI run。
      placeholder: |
        - [ ] ……
        - [ ] ……
    validations:
      required: true

  - type: textarea
    id: supplement
    attributes:
      label: 补充
      description: 仅补充无法自然归入前述内容、但长期有效的信息；没有则留空。
    validations:
      required: false
