server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: prelude
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:13306/prelude?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
  session:
    data:
      redis:
        repository-type: indexed
        namespace: prelude:session
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:16379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 5000ms
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/chat/completions}
  model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
  api-key: ${DEEPSEEK_API_KEY:}

openai:
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  api-key: ${OPENAI_API_KEY:}
  embedding-url: ${OPENAI_EMBEDDING_URL:https://api.openai.com/v1/embeddings}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  crypto:
    aes-secret: ${APP_CRYPTO_AES_SECRET:prelude-local-development-secret-change-me}

prelude:
  oauth:
    google:
      client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${OAUTH_GITHUB_CLIENT_ID:}
      client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:}
  storage:
    s3:
      endpoint: ${PRELUDE_S3_ENDPOINT:http://127.0.0.1:19000}
      public-endpoint: ${PRELUDE_S3_PUBLIC_ENDPOINT:}
      region: ${PRELUDE_S3_REGION:us-east-1}
      bucket: ${PRELUDE_S3_BUCKET:prelude-assets}
      access-key: ${PRELUDE_S3_ACCESS_KEY:prelude-local-key}
      secret-key: ${PRELUDE_S3_SECRET_KEY:prelude-local-secret}
      path-style: ${PRELUDE_S3_PATH_STYLE:true}
      presign-ttl: ${PRELUDE_S3_PRESIGN_TTL:PT10M}
    stale-pending-ttl: ${PRELUDE_STORAGE_STALE_PENDING_TTL:PT24H}
    reconcile-interval-ms: ${PRELUDE_STORAGE_RECONCILE_INTERVAL_MS:300000}
  llm:
    egress:
      allow-http: ${PRELUDE_LLM_EGRESS_ALLOW_HTTP:false}
      allow-private-addresses: ${PRELUDE_LLM_EGRESS_ALLOW_PRIVATE_ADDRESSES:false}
      allowed-ports: ${PRELUDE_LLM_EGRESS_ALLOWED_PORTS:443}
  realtime:
    mode: ${PRELUDE_REALTIME_MODE:local}
  voice:
    tts-pool-size: 4
  jobs:
    recovery-enabled: true
    execution-lease-seconds: 300
    dispatch-recovery-delay-ms: 30000
    redispatch-after-seconds: 60
    report:
      max-attempts: 3
  retrieval:
    hybrid:
      vector-weight: 0.7
      keyword-weight: 0.3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: info
    com.prelude: info
