# Architecture constraints executed by CI. Violations block the build.
# Application coverage is enforced by JaCoCo in backend/pom.xml.

[constraints]
min_equality = 0.47

[[boundaries]]
from = "backend/src/main/java/com/prelude/identity/api/*"
to = "backend/src/main/java/com/prelude/identity/*Mapper.java"
reason = "Identity API adapters depend on application use cases, not persistence mappers."

[[boundaries]]
from = "backend/src/main/java/com/prelude/resume/api/*"
to = "backend/src/main/java/com/prelude/resume/infrastructure/persistence/*"
reason = "Resume API adapters depend on application use cases, not persistence mappers."

[[boundaries]]
from = "backend/src/main/java/com/prelude/interview/application/*"
to = "backend/src/main/java/com/prelude/resume/infrastructure/*"
reason = "Interview application reads resume data only through ResumeContextPort."

[[boundaries]]
from = "backend/src/main/java/com/prelude/interview/application/*"
to = "backend/src/main/java/com/prelude/template/infrastructure/*"
reason = "Interview application reads catalog data only through PositionCatalogPort."

[[boundaries]]
from = "backend/src/main/java/com/prelude/artifact/application/*"
to = "backend/src/main/java/com/prelude/interview/infrastructure/*"
reason = "Artifact application reaches interview state only through InterviewReportPort."

[[boundaries]]
from = "backend/src/main/java/com/prelude/interview/api/*"
to = "backend/src/main/java/com/prelude/interview/infrastructure/persistence/*"
reason = "Interview API adapters depend on application ports, not persistence mappers."

[[boundaries]]
from = "backend/src/main/java/com/prelude/voice/api/*"
to = "backend/src/main/java/com/prelude/interview/infrastructure/persistence/*"
reason = "Voice API adapters depend on application ports, not persistence mappers."

[[boundaries]]
from = "backend/src/main/java/com/prelude/artifact/api/*"
to = "backend/src/main/java/com/prelude/artifact/infrastructure/persistence/*"
reason = "Artifact API adapters depend on application use cases, not persistence mappers."

[[boundaries]]
from = "backend/src/main/java/com/prelude/template/api/*"
to = "backend/src/main/java/com/prelude/template/infrastructure/persistence/*"
reason = "Template API adapters depend on application use cases, not persistence mappers."

[coverage]
target = "core-application-instruction-70"
blocking = true
