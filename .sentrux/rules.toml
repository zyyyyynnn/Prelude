# Sentrux-supported structural constraints.
# Backend module topology and framework isolation are enforced by
# ApplicationModulesTest and FrameworkLeakageTest, not custom TOML sections.

[constraints]
min_quality = 0.65
max_cycles = 0

[[layers]]
name = "app"
paths = ["frontend/src/app"]
order = 0

[[layers]]
name = "features"
paths = ["frontend/src/features"]
order = 1

[[layers]]
name = "shared"
paths = ["frontend/src/shared"]
order = 2

[[boundaries]]
from = "frontend/src/shared"
to = "frontend/src/features"
reason = "shared cannot import features"

[[boundaries]]
from = "frontend/src/shared"
to = "frontend/src/app"
reason = "shared cannot import app"

[[boundaries]]
from = "frontend/src/features"
to = "frontend/src/app"
reason = "features cannot import app"
